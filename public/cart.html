<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><title>Your Cart - Hunza Store</title></head>
<body data-page="cart">
<main class="container">
  <div class="panel empty" id="empty" hidden><h2>Your cart is empty</h2><p>Add some pure Hunza dry fruits to get started.</p><a href="index.html#products" class="btn">Start Shopping</a></div>
  <div class="cart-wrap" id="cart-wrap">
    <div class="panel"><h2>Shopping Cart</h2><div id="cart-items"></div></div>
    <aside class="panel">
      <h2>Order Summary</h2>
      <div id="summary"></div>
      <h3 class="sub-h">Delivery Details</h3>
      <form id="checkout" novalidate>
        <div class="form-group"><label for="fullName">Full Name</label><input id="fullName" type="text" autocomplete="name"></div>
        <div class="form-group"><label for="phone">Phone Number</label><input id="phone" type="tel" placeholder="03XX-XXXXXXX" autocomplete="tel"></div>
        <div class="form-group"><label for="address">Full Address</label><textarea id="address" rows="3" autocomplete="street-address"></textarea></div>
        <div class="form-group"><label for="city">City</label><input id="city" type="text" autocomplete="address-level2"></div>
        <div class="form-group"><label>Payment Method</label><label class="pay"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label></div>
        <p class="error" id="form-error" hidden></p>
        <button type="submit" class="btn btn-block" id="confirm-btn">Confirm Order</button>
      </form>
    </aside>
  </div>
  <div id="success" hidden></div>
</main>
<script src="app.js"></script>
</body></html>
